  "approved_requirements": [
    {
      "id": "REQ-PAIR-001",
      "statement": "A deployment administrator shall be able to link IPMI Monitor or the DC Overview/Watchdog controller to an existing or newly created CryptoLabs account using outbound HTTPS to the existing public CryptoLabs WordPress service for account pairing. Existing product service validation may use its existing approved HTTPS endpoint. Provider VPN access, an inbound deployment callback and per-deployment hostname admission shall not be prerequisites.",
      "authority_status": "owner_approved_scope_quality_ready",
      "trace_id": "TRACE-PAIR-001",
      "verification_id": "VER-PAIR-001",
      "validation_id": "VAL-PAIR-001"
    },
    {
      "id": "REQ-PAIR-002",
      "statement": "The public linking flow shall require signed-in account consent through a nonce-protected POST for the matching displayed one-time user code. Opening a link, signing up or presenting a payment-success parameter alone shall not authorize a deployment.",
      "authority_status": "owner_approved_scope_quality_ready",
      "trace_id": "TRACE-PAIR-002",
      "verification_id": "VER-PAIR-002",
      "validation_id": "VAL-PAIR-002"
    },
    {
      "id": "REQ-PAIR-003",
      "statement": "Pending linking attempts shall expire after 300 seconds, enforce bounded issuance, approval guesses and polling, and permit only one successful redemption through atomic persistent transitions across workers. Secret device codes shall remain backend-only and shall not be stored in plaintext by WordPress.",
      "authority_status": "owner_approved_scope_quality_ready",
      "trace_id": "TRACE-PAIR-003",
      "verification_id": "VER-PAIR-003",
      "validation_id": "VAL-PAIR-003"
    },
    {
      "id": "REQ-PAIR-004",
      "statement": "A deployment shall accept a result only for the initiating current local administrator and session. It shall stage and verify the authoritative result before an intentional commit, consume the local attempt once, and preserve an existing working link on failure, denial, cancellation, expiry, session change or account mismatch. A first link may save verified WordPress identity with no paid grant when service validation fails; an existing different working credential/configuration shall not be replaced by a candidate that fails service validation. A same-key re-link shall not newly assert paid readiness on validation failure.",
      "authority_status": "owner_approved_scope_quality_ready",
      "trace_id": "TRACE-PAIR-004",
      "verification_id": "VER-PAIR-004",
      "validation_id": "VAL-PAIR-004"
    },
    {
      "id": "REQ-PAIR-005",
      "statement": "The new flow shall deliver only the existing product account credential and allowlisted authoritative identity/status fields over a backend HTTPS response. It shall preserve current service entitlement/quota decisions, worker-scoped credentials and local administration/update authority. Pairing shall not grant a new paid entitlement, change retention/outage policies, or give the provider host access.",
      "authority_status": "owner_approved_scope_quality_ready",
      "trace_id": "TRACE-PAIR-005",
      "verification_id": "VER-PAIR-005",
      "validation_id": "VAL-PAIR-005"
    },
    {
      "id": "REQ-PAIR-006",
      "statement": "The implementation shall preserve existing working links and legacy clients, keep the current pinned WordPress package/publisher boundary, and deliver installed product updates through accepted DC Overview Fleet Management. Deployment and paid-service acceptance shall remain held until observed in the intended environment.",
      "authority_status": "owner_approved_scope_quality_ready",
      "trace_id": "TRACE-PAIR-006",
      "verification_id": "VER-PAIR-006",
      "validation_id": "VAL-PAIR-006"
    }
  ]
}
