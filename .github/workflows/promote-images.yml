name: Promote tested image aliases
permissions:
  contents: read
concurrency:
  group: image-alias-promotion-${{ github.repository }}
  cancel-in-progress: false
jobs:
  promote:
    uses: cryptolabsza/cryptolabs-proxy/.github/workflows/ci-image-promote-recipe.yml@accf406152c36d166ddab4cd7468a555cef0cadd
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      release_tag: ${{ inputs.release_tag }}
      source_sha: ${{ inputs.source_sha }}
      cryptolabs_proxy_digest: ${{ inputs.cryptolabs_proxy_digest }}
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published numeric release tag whose immutable images passed all customer gates
        required: true
        type: string
      source_sha:
        description: Exact full source commit of the tested release
        required: true
        type: string
      cryptolabs_proxy_digest:
        description: Exact tested cryptolabs-proxy manifest/index digest (sha256:...)
        required: true
        type: string
