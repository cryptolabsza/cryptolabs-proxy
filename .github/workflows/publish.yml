name: Publish verified Python release
permissions:
  contents: read
concurrency:
  group: python-release-${{ github.repository }}-${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  cpu-build:
    uses: cryptolabsza/cryptolabs-proxy/.github/workflows/ci-python-build-recipe.yml@6a6a846245461b9a7ae593bbf1720b8753bfb957
    permissions:
      contents: read
  publish:
    needs: cpu-build
    if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    uses: cryptolabsza/cryptolabs-proxy/.github/workflows/ci-pypi-publish-recipe.yml@28d6f00b5162f86cf5f90c98bcb7d5e64226fbbf
    permissions:
      actions: read
      contents: write
    with:
      producer_run_id: ${{ inputs.producer_run_id || (needs.cpu-build.result == 'success' && github.run_id) || '' }}
      producer_attempt: ${{ inputs.producer_attempt || (needs.cpu-build.result == 'success' && github.run_attempt) || '' }}
      artifact_id: ${{ inputs.artifact_id || needs.cpu-build.outputs.artifact_id || '' }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
'on':
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag (vX.Y.Z)
        required: true
        type: string
      version:
        description: Version matching the tag and pyproject.toml (X.Y.Z)
        required: true
        type: string
      producer_run_id:
        description: Existing verified producer producer run id, or leave all three blank
        required: false
        type: string
      producer_attempt:
        description: Existing verified producer producer attempt, or leave all three blank
        required: false
        type: string
      artifact_id:
        description: Existing verified producer artifact id, or leave all three blank
        required: false
        type: string
  push:
    branches:
    - dev
    - main
  pull_request:
    branches:
    - dev
    - main
