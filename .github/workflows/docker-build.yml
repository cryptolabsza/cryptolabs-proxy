name: Build and Push Docker Image
concurrency:
  group: image-release-publication-${{ github.repository }}-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref
    }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  release-preflight:
    if: github.event_name != 'pull_request'
    uses: cryptolabsza/cryptolabs-proxy/.github/workflows/ci-image-preflight-recipe.yml@e02ebff9390d806d06261f03ec2ff519f980800f
    permissions:
      contents: read
      packages: read
  build:
    uses: cryptolabsza/cryptolabs-proxy/.github/workflows/ci-image-build-recipe.yml@aadf8cccc44806f9007b20133c4c92736e33baa6
    permissions:
      contents: read
  publish-build:
    if: github.event_name != 'pull_request'
    needs:
    - build
    - release-preflight
    uses: cryptolabsza/cryptolabs-proxy/.github/workflows/ci-image-publish-recipe.yml@046a041bbd6adf388a626e7d89bf70db12a97c94
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      artifact_id: ${{ needs.build.outputs.artifact_id }}
  release-readback:
    if: always() && needs.release-preflight.result == 'success'
    uses: cryptolabsza/cryptolabs-proxy/.github/workflows/ci-image-readback-recipe.yml@e02ebff9390d806d06261f03ec2ff519f980800f
    permissions:
      contents: read
      packages: read
    needs:
    - release-preflight
    - publish-build
'on':
  push:
    branches:
    - main
    - dev
    tags:
    - v*
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: {}
permissions:
  contents: read
