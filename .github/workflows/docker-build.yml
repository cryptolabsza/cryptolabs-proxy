name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: image-release-publication-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-preflight:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.guard.outputs.build }}
      status: ${{ steps.guard.outputs.status }}
    steps:
      - name: Initialize isolated runner path
        run: |
          printf 'RELEASE_RECEIPT=%s/image-release-preflight-%s-%s.json\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify product release identities
        id: guard
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
          TAG_OVERRIDE: ''
        run: python scripts/image_promotion.py guard --platform linux/amd64 --receipt "$RELEASE_RECEIPT"
      - name: Retain release identity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-release-preflight-receipt
          path: ${{ env.RELEASE_RECEIPT }}
          if-no-files-found: warn
          retention-days: 90

  build:
    needs: release-preflight
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Initialize isolated runner path
        run: |
          printf 'DOCKER_CONFIG=%s/docker-config-proxy-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up QEMU
        if: needs.release-preflight.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: needs.release-preflight.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && needs.release-preflight.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute safe build tags
        id: tags
        env:
          TAG_OVERRIDE: ''
        run: python scripts/image_promotion.py tags --image ghcr.io/cryptolabsza/cryptolabs-proxy

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tags.outputs.version }}
            type=sha,format=long

      - name: Generate build info
        if: needs.release-preflight.outputs.build == 'true'
        run: |
          cat > BUILD_INFO << EOF
          BUILD_BRANCH=${{ github.ref_name }}
          BUILD_COMMIT=${{ github.sha }}
          BUILD_SHORT_COMMIT=${GITHUB_SHA::7}
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          BUILD_VERSION=${{ steps.tags.outputs.version }}
          EOF
          cat BUILD_INFO

      - name: Build and push Docker image
        if: needs.release-preflight.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/cryptolabsza/cryptolabs-proxy
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          # Don't use cache for this image - build args must be fresh each build
          # The image is small so this is acceptable
          no-cache: true
          build-args: |
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
            VERSION=${{ steps.tags.outputs.version }}

      - name: Cleanup Docker credentials
        if: always()
        run: |
          docker --config "$DOCKER_CONFIG" logout ghcr.io 2>/dev/null || true
          rm -rf "$DOCKER_CONFIG"

      - name: Generate build summary
        run: |
          echo "## Docker image workflow result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preflight:** ${{ needs.release-preflight.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Requested identity tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  release-readback:
    needs: [release-preflight, build]
    if: always() && needs.release-preflight.result == 'success'
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Initialize isolated runner path
        run: |
          printf 'RELEASE_RECEIPT=%s/image-release-readback-%s-%s.json\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify product release identities
        id: guard
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
          TAG_OVERRIDE: ''
        run: python scripts/image_promotion.py guard --platform linux/amd64 --receipt "$RELEASE_RECEIPT" --require-existing
      - name: Retain release identity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-release-readback-receipt
          path: ${{ env.RELEASE_RECEIPT }}
          if-no-files-found: warn
          retention-days: 90
