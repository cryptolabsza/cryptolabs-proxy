# TRACEWEAVER: file-role=pairing-routing; req=REQ-PAIR-001; trace=TRACE-PAIR-001; ver=VER-PAIR-001
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name fleet.example.test;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name fleet.example.test;

        ssl_certificate /etc/letsencrypt/live/fleet.example.test/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fleet.example.test/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;

        # DNS resolver for Docker networks - CRITICAL for runtime resolution
        # This allows nginx to start even if backend services don't exist yet
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # =====================================================
        # ERROR HANDLERS
        # =====================================================
        
        location @service_unavailable {
            default_type application/json;
            return 503 '{"error":"Service unavailable","message":"The requested service is not running. Install it or wait for it to start."}';
        }

        # =====================================================
        # AUTHENTICATION
        # =====================================================
        
        # Auth server endpoints (public)
        location ^~ /api/account-link/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        location /auth/ {
            proxy_pass http://127.0.0.1:8081/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Internal auth verification endpoint (for auth_request)
        location = /_auth_check {
            internal;
            proxy_pass http://127.0.0.1:8081/auth/headers;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        # =====================================================
        # Internal API (blocked from public access)
        # Only reachable via direct Docker network (172.30.0.10:8080)
        # =====================================================
        location /internal/ {
            return 403;
        }

        # =====================================================
        # PUBLIC ENDPOINTS (no auth required)
        # =====================================================
        
        # Health check API (always public)
        location /api/health {
            default_type application/json;
            return 200 '{"status":"ok","proxy":"running"}';
        }

        # Service health check (internal, no auth)
        location /api/services {
            proxy_pass http://127.0.0.1:8080/api/services;
            proxy_set_header Host $host;
        }

        location /api/build-info {
            proxy_pass http://127.0.0.1:8080/api/build-info;
        }
        
        # Version management and update endpoints (protected)
        location /api/versions {
            auth_request /_auth_check;
            error_page 401 = @api_unauthorized;
            proxy_pass http://127.0.0.1:8080/api/versions;
            proxy_set_header Host $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
        
        location /api/update-settings {
            auth_request /_auth_check;
            error_page 401 = @api_unauthorized;
            proxy_pass http://127.0.0.1:8080/api/update-settings;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
        
        location /api/update {
            auth_request /_auth_check;
            error_page 401 = @api_unauthorized;
            proxy_pass http://127.0.0.1:8080/api/update;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;  # Updates can take time
        }
        
        location /api/pull {
            auth_request /_auth_check;
            error_page 401 = @api_unauthorized;
            proxy_pass http://127.0.0.1:8080/api/pull;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;  # Image pulls can be slow
        }

        location @api_unauthorized {
            default_type application/json;
            return 401 '{"error":"Authentication required"}';
        }
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 1h;
        }
        # Static assets (no auth)
        location /static/ {
            root /usr/share/nginx/html;
        }

        # =====================================================
        # PROTECTED ENDPOINTS (auth required)
        # =====================================================
        
        # Fleet Management Landing Page (requires auth)
        location = / {
            auth_request /_auth_check;
            auth_request_set $auth_user $upstream_http_x_fleet_auth_user;
            auth_request_set $auth_role $upstream_http_x_fleet_auth_role;
            auth_request_set $auth_token $upstream_http_x_fleet_auth_token;
            
            # Redirect to login if not authenticated
            error_page 401 = @login_redirect;
            
            root /usr/share/nginx/html;
            index index.html;
        }

        location @login_redirect {
            return 302 /auth/login?next=$request_uri;
        }

        # VPM calls these endpoints only over the Docker network on port 8081.
        # Exact locations keep the generic public /auth/ forwarding route from
        # exposing the session authority or password reauthentication API.
        location = /auth/vast-price-manager/session { return 404; }
        location = /auth/vast-price-manager/session/ { return 404; }
        location = /auth/vast-price-manager/reauth { return 404; }
        location = /auth/vast-price-manager/reauth/ { return 404; }
        # Vast Price Manager has a dedicated admin-only route.  It strips the
        # prefix once and explicitly preserves the remainder and query string.
        location = /_vast_pricing_admin {
            internal;
            proxy_pass http://127.0.0.1:8081/auth/vast-price-manager/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
        }

        location = /vast-pricing {
            return 308 /vast-pricing/;
        }

        location ~ ^/vast-pricing(?<vpm_upstream_path>/.*)$ {
            auth_request /_vast_pricing_admin;
            error_page 401 = @login_redirect;

            # Runtime Docker DNS resolution permits startup before this opt-in
            # service has been installed.
            set $upstream_vast_price_manager vast-price-manager;
            proxy_pass http://$upstream_vast_price_manager:8088$vpm_upstream_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # VPM directly introspects the signed Fleet session on its
            # configured internal origin. Never pass client identity headers.
            proxy_set_header X-Fleet-Auth-User "";
            proxy_set_header X-Fleet-Auth-Role "";
            proxy_set_header X-Fleet-Auth-Token "";
            proxy_set_header X-Fleet-Authenticated "";
            # Preserve the browser Fleet cookie for VPM's direct introspection.
            proxy_set_header Cookie $http_cookie;
            # Auth-request failures still use the redirect above. Do not
            # intercept VPM's own 401 reauthentication result, which must
            # reach its caller as an error rather than a Fleet login redirect.
            proxy_intercept_errors off;
            error_page 502 503 504 = @service_unavailable;
        }
        # IPMI Monitor API - returns JSON 401 for unauthenticated requests
        location ~ ^/ipmi/api/(.*)$ {
            auth_request /_auth_check;
            auth_request_set $auth_user $upstream_http_x_fleet_auth_user;
            auth_request_set $auth_role $upstream_http_x_fleet_auth_role;
            auth_request_set $auth_token $upstream_http_x_fleet_auth_token;
            error_page 401 = @api_unauthorized;
            
            set $upstream_ipmi http://ipmi-monitor:5000;
            proxy_pass $upstream_ipmi/api/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /ipmi;
            proxy_set_header X-Fleet-Auth-User $auth_user;
            proxy_set_header X-Fleet-Auth-Role $auth_role;
            proxy_set_header X-Fleet-Auth-Token $auth_token;
            proxy_set_header X-Fleet-Authenticated true;
            proxy_read_timeout 300s;
            
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        # IPMI Monitor - regex location to properly rewrite URI with variable proxy_pass
        location ~ ^/ipmi/(.*)$ {
            auth_request /_auth_check;
            auth_request_set $auth_user $upstream_http_x_fleet_auth_user;
            auth_request_set $auth_role $upstream_http_x_fleet_auth_role;
            auth_request_set $auth_token $upstream_http_x_fleet_auth_token;
            error_page 401 = @login_redirect;
            
            # Variable allows nginx to start even if service doesn't exist
            set $upstream_ipmi http://ipmi-monitor:5000;
            proxy_pass $upstream_ipmi/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /ipmi;
            # Forward authentication headers from proxy auth
            proxy_set_header X-Fleet-Auth-User $auth_user;
            proxy_set_header X-Fleet-Auth-Role $auth_role;
            proxy_set_header X-Fleet-Auth-Token $auth_token;
            proxy_set_header X-Fleet-Authenticated true;
            proxy_read_timeout 300s;
            
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        # DC Overview API - returns JSON 401 for unauthenticated requests
        location ~ ^/dc/api/(.*)$ {
            auth_request /_auth_check;
            auth_request_set $auth_user $upstream_http_x_fleet_auth_user;
            auth_request_set $auth_role $upstream_http_x_fleet_auth_role;
            auth_request_set $auth_token $upstream_http_x_fleet_auth_token;
            error_page 401 = @api_unauthorized;
            
            set $upstream_dc http://dc-overview:5001;
            proxy_pass $upstream_dc/api/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /dc;
            proxy_set_header X-Fleet-Auth-User $auth_user;
            proxy_set_header X-Fleet-Auth-Role $auth_role;
            proxy_set_header X-Fleet-Auth-Token $auth_token;
            proxy_set_header X-Fleet-Authenticated true;
            proxy_read_timeout 300s;
            
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        # DC Overview / Server Manager - regex location to properly rewrite URI with variable proxy_pass
        location ~ ^/dc/(.*)$ {
            auth_request /_auth_check;
            auth_request_set $auth_user $upstream_http_x_fleet_auth_user;
            auth_request_set $auth_role $upstream_http_x_fleet_auth_role;
            auth_request_set $auth_token $upstream_http_x_fleet_auth_token;
            error_page 401 = @login_redirect;
            
            # Variable allows nginx to start even if service doesn't exist
            set $upstream_dc http://dc-overview:5001;
            proxy_pass $upstream_dc/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /dc;
            # Forward authentication headers from proxy auth
            proxy_set_header X-Fleet-Auth-User $auth_user;
            proxy_set_header X-Fleet-Auth-Role $auth_role;
            proxy_set_header X-Fleet-Auth-Token $auth_token;
            proxy_set_header X-Fleet-Authenticated true;
            proxy_read_timeout 300s;
            
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }
        
        # Shortcuts for /servers and /settings -> /dc/...
        location = /servers {
            return 301 /dc/servers;
        }
        location = /settings {
            return 301 /dc/settings;
        }

        # Grafana - uses variable for runtime DNS resolution
        location /grafana/ {
            auth_request /_auth_check;
            auth_request_set $auth_user $upstream_http_x_fleet_auth_user;
            auth_request_set $auth_role $upstream_http_x_fleet_auth_role;
            error_page 401 = @login_redirect;
            
            # Map Fleet roles to Grafana roles
            set $grafana_role "Viewer";
            if ($auth_role = "admin") {
                set $grafana_role "Admin";
            }
            if ($auth_role = "readwrite") {
                set $grafana_role "Editor";
            }
            
            # Variable allows nginx to start even if service doesn't exist
            set $upstream_grafana http://grafana:3000;
            proxy_pass $upstream_grafana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pass authenticated user and role to Grafana
            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_set_header X-WEBAUTH-ROLE $grafana_role;
            proxy_read_timeout 300s;
            
            # Inject Fleet Management Home button into Grafana HTML
            # target="_top" prevents Grafana's SPA router from intercepting the click
            sub_filter '</head>' '<style>.fleet-home-bar{position:fixed;top:0;left:0;right:0;z-index:99999;background:#1a1a2e;border-bottom:1px solid #333;padding:4px 16px;display:flex;align-items:center;gap:10px;font-family:-apple-system,sans-serif;font-size:13px;height:28px;}.fleet-home-bar a{color:#00b4d8;text-decoration:none;border:1px solid #00b4d8;padding:3px 12px;border-radius:4px;font-size:12px;font-weight:500;transition:background 0.2s;}.fleet-home-bar a:hover{background:rgba(0,180,216,0.15);}.fleet-home-bar span{color:#666;}body{padding-top:36px !important;}</style></head>';
            sub_filter '</body>' '<div class="fleet-home-bar"><a href="/" target="_top">Home</a><span>|</span><span style="color:#888;">Grafana</span></div></body>';
            sub_filter_once on;
            sub_filter_types text/html;
            proxy_set_header Accept-Encoding "";
            
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        # Prometheus - uses variable for runtime DNS resolution
        # Prometheus is configured with --web.route-prefix=/prometheus/ so we must preserve the path
        location /prometheus {
            auth_request /_auth_check;
            error_page 401 = @login_redirect;
            
            # Variable allows nginx to start even if service doesn't exist
            set $upstream_prometheus http://prometheus:9090;
            proxy_pass $upstream_prometheus;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            
            # Inject Fleet Management Home button into Prometheus HTML
            sub_filter '</head>' '<style>.fleet-home-bar{position:fixed;top:0;left:0;right:0;z-index:99999;background:#1a1a2e;border-bottom:1px solid #333;padding:4px 16px;display:flex;align-items:center;gap:10px;font-family:-apple-system,sans-serif;font-size:13px;height:28px;}.fleet-home-bar a{color:#00b4d8;text-decoration:none;border:1px solid #00b4d8;padding:3px 12px;border-radius:4px;font-size:12px;font-weight:500;transition:background 0.2s;}.fleet-home-bar a:hover{background:rgba(0,180,216,0.15);}.fleet-home-bar span{color:#666;}</style></head>';
            sub_filter '</body>' '<div class="fleet-home-bar"><a href="/">Home</a><span>|</span><span style="color:#888;">Prometheus</span></div></body>';
            sub_filter_once on;
            sub_filter_types text/html;
            proxy_set_header Accept-Encoding "";
            
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        # Vast.ai Exporter metrics endpoint
        location /vastai-metrics/ {
            auth_request /_auth_check;
            error_page 401 = @login_redirect;
            
            set $upstream_vastai http://vastai-exporter:8622;
            proxy_pass $upstream_vastai/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        # RunPod Exporter metrics endpoint
        location /runpod-metrics/ {
            auth_request /_auth_check;
            error_page 401 = @login_redirect;
            
            set $upstream_runpod http://runpod-exporter:8623;
            proxy_pass $upstream_runpod/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }


        # Vast Price Manager uses its dedicated admin-only route above.
        # Vast Price Manager uses its dedicated admin-only route above.
        # Vast Price Manager uses its dedicated admin-only route above.
        # Vast Price Manager uses its dedicated admin-only route above.
        # Vast Price Manager uses its dedicated admin-only route above.
        # Vast Price Manager uses its dedicated admin-only route above.
        # Vast Price Manager uses its dedicated admin-only route above.
        
        # Exporter management pages - served by auth server
        location /vastai/ {
            auth_request /_auth_check;
            auth_request_set $auth_user $upstream_http_x_fleet_auth_user;
            auth_request_set $auth_role $upstream_http_x_fleet_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass http://127.0.0.1:8081/vastai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /runpod/ {
            auth_request /_auth_check;
            auth_request_set $auth_user $upstream_http_x_fleet_auth_user;
            auth_request_set $auth_role $upstream_http_x_fleet_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass http://127.0.0.1:8081/runpod/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Exporter account APIs require a current Fleet administrator.
        location = /_exporter_admin {
            internal;
            proxy_pass http://127.0.0.1:8081/auth/exporters/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Capture the suffix explicitly: variable proxy_pass does not replace
        # a prefix URI. Preserve query arguments and never accept a client token.
        location ~ ^/vastai-api/(.*)$ {
            auth_request /_exporter_admin;
            auth_request_set $mgmt_token $upstream_http_x_mgmt_token;
            set $upstream_vastai_api http://vastai-exporter:8622;
            proxy_pass $upstream_vastai_api/api/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Mgmt-Token $mgmt_token;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        location ~ ^/runpod-api/(.*)$ {
            auth_request /_exporter_admin;
            auth_request_set $mgmt_token $upstream_http_x_mgmt_token;
            set $upstream_runpod_api http://runpod-exporter:8623;
            proxy_pass $upstream_runpod_api/api/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Mgmt-Token $mgmt_token;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }
        # Default: show landing page
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

}